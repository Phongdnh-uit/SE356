spring:
  # Cấu hình data source cho môi trường prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30 # Tăng pool size cho traffic lớn
      minimum-idle: 10
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      pool-name: LastMileHikariPool

  # Cấu hình JPA cho môi trường local
  jpa:
    hibernate:
      ddl-auto: validate # Validate khi có flyway
    show-sql: false # Tắt hiển thị câu lệnh SQL trong log để tránh lộ thông tin nhạy cảm
    properties:
      hibernate:
        default_batch_fetch_size: 20 # Kích thước batch mặc định cho các truy vấn liên quan đến collection
        order_updates: true # Tối ưu cập nhật bằng cách nhóm các câu lệnh UPDATE lại với nhau
        order_inserts: true # Tối ưu chèn bằng cách nhóm các câu lệnh INSERT lại với nhau
        jdbc:
          batch_size: 50 # Kích thước batch cho các câu lệnh SQL
          batch_versioned_data: true # Cho phép batch các câu lệnh UPDATE/DELETE có phiên bản
  flyway:
    clean-disabled: true # Vô hiệu hóa lệnh clean trong môi trường production

  data:
    redis:
      username: ${REDIS_USERNAME}
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true # Bật SSL cho Redis nếu được hỗ trợ bởi provider
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile,email
            redirect-uri: "{baseUrl}/oauth2/callback/google"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

server:
  port: ${PORT:8080} # Lấy port từ biến môi trường, mặc định là 8080

logging:
  level:
    root: WARN # Giảm mức log gốc để tránh quá tải log
    "[com.uit.se356.core]": INFO # Giữ mức log INFO cho package chính của ứng dụng

management:
  endpoints:
    web:
      exposure:
        # Chỉ expose những gì thực sự cần thiết
        include: health, info, prometheus
      base-path: ${ACTUATOR_BASE_PATH:/actuator} # Thay đổi path mặc định (/actuator) để tăng tính bảo mật
  endpoint:
    health:
      show-details: never # Không show chi tiết DB, Disk cho người dùng công cộng, sửa lại when-authorized nếu có security
      probes:
        enabled: true # Bật Liveness và Readiness probes cho Render
    # prometheus:
    #   access: read-only
  metrics:
    tags:
      application: ${spring.application.name:core-service} # Lấy tên app tự động
      env: production # Phân biệt môi trường
    distribution:
      percentiles:
        http:
          server:
            requests:
              - 0.95
              - 0.99 # Định nghĩa percentiles cho tất cả các endpoint HTTP server
      percentiles-histogram:
        http:
          server:
            requests: true # Bật histogram cho tất cả các endpoint HTTP server
      slo:
        http:
          server:
            requests:
              - 100ms
              - 300ms
              - 500ms
              - 1s # Định nghĩa SLO cho các endpoint HTTP server
      maximum-expected-value:
        http:
          server:
            requests: 10s # Giới hạn giá trị tối đa cho histogram để tránh bị ảnh hưởng bởi outliers
      minimum-expected-value:
        http:
          server:
            requests: 10ms # Giới hạn giá trị tối thiểu cho histogram để tránh bị ảnh hưởng bởi outliers

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: ${JWT_EXPIRATION:86400000} # 1 ngày
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 ngày
    encryption-salt: ${ENCRYPTION_SALT}
    encryption-secret-key: ${ENCRYPTION_SECRET_KEY}
    monitoring-secret: ${MONITORING_SECRET}
  mail:
    from: ${MAIL_FROM}
  frontend:
    base-url: ${FRONTEND_BASE_URL}
    verify-email-path: ${FRONTEND_VERIFY_EMAIL_PATH:/verify-email}
    reset-password-path: ${FRONTEND_RESET_PASSWORD_PATH:/reset-password}
    logo-url: ${FRONTEND_LOGO_URL:https://res.cloudinary.com/dfavjndwj/image/upload/v1771167529/Vector_scx4r9.jpg}
    oauth2-callback-path: ${FRONTEND_OAUTH2_CALLBACK_PATH:/oauth2/callback}
  verification:
    email-link-expiration: ${EMAIL_LINK_EXPIRATION:900}
    sms-otp-expiration: ${SMS_OTP_EXPIRATION:300}
    phone-verified-token-expiration: ${PHONE_VERIFIED_TOKEN_EXPIRATION:600}
    forgot-password-code-expiration: ${FORGOT_PASSWORD_CODE_EXPIRATION:300}
    prechallenge-token-expiration: ${PRECHALLENGE_TOKEN_EXPIRATION:600}
    mfa-challenge-expiration: ${MFA_CHALLENGE_EXPIRATION:600}
  bootstrap:
    admin-email: ${ADMIN_EMAIL}
    admin-full-name: ${ADMIN_FULL_NAME}
    admin-password: ${ADMIN_PASSWORD}
    admin-phone-number: ${ADMIN_PHONE_NUMBER}
  s3:
    endpoint: ${S3_ENDPOINT}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    main-bucket-name: ${S3_MAIN_BUCKET_NAME}
    quarantine-bucket-name: ${S3_QUARANTINE_BUCKET_NAME}
  payment:
    momo:
      access-key: ${MOMO_ACCESS_KEY}
      notify-url: ${MOMO_NOTIFY_URL}
      partner-code: ${MOMO_PARTNER_CODE}
      request-url: ${MOMO_REQUEST_URL}
      return-url: ${MOMO_RETURN_URL}
      secret-key: ${MOMO_SECRET_KEY}

springdoc:
  default-produces-media-type: application/json
